name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -no-color

  backend:
    name: Backend lint, test and migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check app tests alembic
      - run: python -m ruff check app tests alembic
      - name: Audit production Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - run: python -m pytest -q
      - name: Verify a clean migration
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: python -m alembic upgrade head

  flutter:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: learnmate-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  container:
    name: Backend container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: learnmate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
