name: Deploy services

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger configured deployment hooks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run reviewed backend migrations
        env:
          MIGRATION_HOOK_URL: ${{ secrets.BACKEND_MIGRATION_HOOK_URL }}
        run: |
          if [ -z "$MIGRATION_HOOK_URL" ]; then
            echo "BACKEND_MIGRATION_HOOK_URL is required before a production rollout."
            exit 1
          fi
          curl --fail-with-body --retry 3 --request POST "$MIGRATION_HOOK_URL"
      - name: Trigger backend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "BACKEND_DEPLOY_HOOK_URL is required for a production deployment."
            exit 1
          fi
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK_URL"
      - name: Verify backend health
        env:
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "BACKEND_HEALTHCHECK_URL is required after a production rollout."
            exit 1
          fi
          curl --fail-with-body --retry 10 --retry-delay 5 "$HEALTHCHECK_URL"
      - name: Trigger administrator web deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.ADMIN_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "ADMIN_DEPLOY_HOOK_URL is required for a production deployment."
            exit 1
          fi
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK_URL"
      - name: Verify administrator health
        env:
          HEALTHCHECK_URL: ${{ secrets.ADMIN_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "ADMIN_HEALTHCHECK_URL is required after a production rollout."
            exit 1
          fi
          curl --fail-with-body --retry 10 --retry-delay 5 "$HEALTHCHECK_URL"
