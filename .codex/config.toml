[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false

[mcp_servers.learnmate]
command = "D:/GraduationProject/backend/.venv/Scripts/python.exe"
args = ["-m", "app.mcp_server"]
cwd = "D:/GraduationProject/backend"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "STITCH_API_KEY" }
enabled = true
required = false
tool_timeout_sec = 300
